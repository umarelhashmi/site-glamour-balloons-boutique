<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
  <title>Glamour Balloons Boutique – Luxury Event &amp; Balloon Design | Orlando &amp; Kissimmee</title>
  <meta name="description" content="Glamour Balloons Boutique - Your Customizes Balloons Resource Where You Can Find Inspiration For Everyone!" />
  <link rel="icon" type="image/png" href="assets/images/logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..700;1,6..96,400..600&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css?v=20261025g" />
</head>
<body>
  <!-- ====================================================================
       1. HEADER (Logo + 7 Original Navigation Items Only)
       ==================================================================== -->
  <header class="masthead">
    <div class="masthead-inner">
      <div class="masthead-brand" data-nav="home" role="button" tabindex="0" aria-label="Glamour Balloons Boutique Home">
        <div class="masthead-seal">
          <img src="assets/images/logo.png" alt="Glamour Balloons Boutique" fetchpriority="high" />
        </div>
      </div>

      <nav class="masthead-chapters" aria-label="Primary Navigation">
        <button type="button" class="chapter-link active" data-nav="home">Home</button>
        <button type="button" class="chapter-link" data-nav="what-we-offer">What We Offer!</button>
        <button type="button" class="chapter-link" data-nav="luxury-packages">Luxury Packages</button>
        <button type="button" class="chapter-link" data-nav="party-packages">Party Packages</button>
        <button type="button" class="chapter-link" data-nav="thematic-sets">Thematic Decor Sets</button>
        <button type="button" class="chapter-link" data-nav="grab-go">Grab &amp; Go Decor</button>
        <button type="button" class="chapter-link" data-nav="contact">Contact</button>
      </nav>
    </div>
  </header>

  <!-- ====================================================================
       2. DYNAMIC ATELIER STAGE (ALL PAGES RENDERED BY APP.JS)
       ==================================================================== -->
  <main class="atelier-stage" id="atelierStage"></main>

  <!-- ====================================================================
       3. FOOTER (100% Verbatim from Original Site)
       ==================================================================== -->
  <footer class="atelier-footer">
    <div style="max-width:1360px;margin:0 auto;">
      <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:1.25rem;padding-bottom:1.25rem;">
        <ul class="footer-links" style="flex-direction:row;flex-wrap:wrap;gap:1.35rem;">
          <li><button type="button" data-nav="home">Home</button></li>
          <li><button type="button" data-nav="what-we-offer">What We Offer!</button></li>
          <li><button type="button" data-nav="luxury-packages">Luxury Packages</button></li>
          <li><button type="button" data-nav="party-packages">Party Packages</button></li>
          <li><button type="button" data-nav="thematic-sets">Thematic Decor Sets</button></li>
          <li><button type="button" data-nav="grab-go">Grab &amp; Go Decor</button></li>
          <li><button type="button" data-nav="contact">Contact</button></li>
        </ul>

        <div style="display:flex;gap:1rem;font-size:0.85rem;">
          <a href="https://www.facebook.com/GlamourBalloonsBoutique/" target="_blank" rel="noopener">Facebook</a>
          <a href="https://www.instagram.com/glamourballoonsboutique/" target="_blank" rel="noopener">Instagram</a>
        </div>

        <div style="font-size:0.82rem;opacity:0.88;">
          <span>© 2026 Glamour Balloons Boutique LLC - All Rights Reserved</span>
        </div>
      </div>
    </div>
  </footer>

  <!-- ====================================================================
       4. NATIVE MOBILE BOTTOM DOCK
       ==================================================================== -->
  <nav class="mobile-native-dock" aria-label="Mobile Navigation Dock">
    <button type="button" class="dock-btn active" data-nav="home">
      <span>Home</span>
    </button>
    <button type="button" class="dock-btn" data-nav="what-we-offer">
      <span>What We Offer!</span>
    </button>
    <button type="button" class="dock-btn" data-nav="party-packages">
      <span>Party Packages</span>
    </button>
    <button type="button" class="dock-btn" data-nav="grab-go">
      <span>Grab &amp; Go</span>
    </button>
    <button type="button" class="dock-btn" data-nav="contact">
      <span>Contact</span>
    </button>
  </nav>

  <!-- ====================================================================
       5. FULL RESOLUTION IMAGE LIGHTBOX
       ==================================================================== -->
  <div class="modal-backdrop" id="lightboxModal" aria-hidden="true">
    <div class="couture-modal lightbox-modal-content" role="dialog" aria-label="Image Preview">
      <button type="button" class="modal-close-btn" data-close-modal="lightboxModal" aria-label="Close">×</button>
      <img id="lightboxImg" src="assets/images/logo.png" alt="Preview" />
      <p id="lightboxCaption" style="font-family:var(--font-display);font-size:1.15rem;font-weight:600;margin-top:0.75rem;color:var(--mulberry-ink);"></p>
    </div>
  </div>

  <script src="data.js?v=20261025g"></script>
  <script src="app.js?v=20261025g"></script>
</body>
</html>
